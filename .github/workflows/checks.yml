name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palette:
    name: Palette and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/theme.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/theme.py --check --package
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Firefox manifest lint
        run: npx --yes web-ext@8.9.0 lint --source-dir theme --warnings-as-errors
      - uses: actions/upload-artifact@v4
        with:
          name: theme-package
          path: dist/

  amo:
    name: AMO compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_amo.py

  firefox:
    name: Firefox / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: '159.0.1'
      - name: Prepare isolated display
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v import >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb imagemagick
          fi
      - name: Native Firefox theme checks (Linux display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x1000x24" python tests/firefox_ui.py --headed --firefox "${{ steps.firefox.outputs.firefox-path }}"
      - name: Native Firefox theme checks (Windows headless)
        if: runner.os == 'Windows'
        run: python tests/firefox_ui.py --firefox "${{ steps.firefox.outputs.firefox-path }}"
      - name: Export review evidence
        if: always() && runner.os == 'Linux'
        run: |
          python -c "import base64,json; from pathlib import Path; names=['menu.png','selected-menu.png','selected-address-result.png','report.json','failure.png']; print('REVIEW_JSON='+json.dumps({name:base64.b64encode((Path('artifacts/firefox')/name).read_bytes()).decode() for name in names if (Path('artifacts/firefox')/name).exists()}))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-${{ matrix.os }}
          path: artifacts/firefox/
