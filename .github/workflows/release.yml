name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish checked release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release.py
